<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>Lists</title>
</head>

<body>
  <h2>An ordered HTML list:</h2>
  <ol type="I">
    <li>Orange: This is the fruit we eat in winter</li>
    <li>Apple: Eat apple a day keeps the doctor away</li>
    <li>Mango</li>
    <li>Grapes</li>
  </ol>

  <h2>An unordered HTML list:</h2>
  <ul type="circle">
    <li>Item</li>
    <li>Item</li>
    <li>Item</li>
    <li>Item</li>
  </ul>

  <h2>Definition list:</h2>
  <dl>
    <dt>Tea</dt>
    <dd>- hot drink</dd>

    <dt>Juice</dt>
    <dd>- ice drink</dd>
  </dl>
</body>
</html>
