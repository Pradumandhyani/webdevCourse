
<!-- semantic tags are those which clealy describe their meaning in a human- and machine-readable way. 
Examples of semantic tags include <header>, <footer>, <article>, <section>, and <nav> <audio>. 
  These tags help improve the accessibility and SEO of web pages by providing context to the content they contain. -->

<html>
  
  <body>
