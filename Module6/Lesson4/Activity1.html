<html>
<head>
    <title>A simple calculator</title>
</head>
<body>
    <input onchange="change()" id="num1" placeholder="enter number 1">
    <br>
    <input onchange="change()" id="num2" placeholder="enter number 2">

    <button onclick="one()" id="1">1</button>
    <button id="2">2</button>
    <button id="3">3</button>
    <button id="4">4</button>
    <button id="5">5</button>
    <button id="6">6</button>
    

    <br>
    <button onclick="addition()">+</button>
    <button onclick="sub()">-</button>
    <button onclick="mul()">*</button>
    <button onclick="div()">/</button>
    <br>
    <p id="result"></p>

    <script>
var res=""

function one(){
    res+="1"
}
function add(){
    res+="+"
}

res="123+45*87"
var result=eval(res);

        var num1=Number(document.getElementById("num1").value);
        var num2=Number(document.getElementById("num2").value);
        
        function change(){
            num1=Number(document.getElementById("1").value);
            num2=Number(document.getElementById("num2").value);
        }

        function addition(){
            console.log("num1"+num1);
            console.log("num2"+num2);
            document.getElementById("result").innerHTML=num1+num2;
        }

        function sub(){
            document.getElementById("result").innerHTML=num1-num2;
        }
        function mul(){
            document.getElementById("result").innerHTML=num1*num2;
        }
        function div(){
            if(num2==0){
                document.getElementById("result").innerHTML="num2 cannot be 0";
            }else{
            document.getElementById("result").innerHTML=num1/num2;

        }
