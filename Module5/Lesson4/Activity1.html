<!DOCTYPE html>
<html>
<body>

<h2>The JavaScript String() Method</h2>

<p>The String() method can convert a number to a string.</p>

<p id="number_result"></p>
<p id="string_result"></p>

<script>
let x = 4;
let y=5;

document.getElementById("number_result").innerHTML = x + y; // Adds because it is a number
document.getElementById("string_result").innerHTML = String(x) + String(y) - 3;
// Does not add because it is a string it concatenates
</script>

</body>
</html>
