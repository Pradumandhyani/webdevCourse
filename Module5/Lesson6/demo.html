<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>

        <input onchange="change()" type="number" id="num1" placeholder="Enter first number">
        <input onchange="change()" type="number" id="num2" placeholder="Enter second number">
        <br>
        <button onclick="add()">add</button>
        <button onclick="sub()">sub</button>
        <button onclick="mul()">multiply</button>
        <button onclick="div()">division</button>
        <button onclick="square()">square</button>
        <br>
        <p id="result"></p>

        <script>

            let num1;
            let num2;
            function change(){

            num1=parseInt(document.getElementById("num1").value);
            num2=parseInt(document.getElementById("num2").value);
            }


            function add(){
                let result = num1+num2;
                document.getElementById("result").innerHTML=result;
            }
            function sub(){
                let result = num1-num2;
                document.getElementById("result").innerHTML=result;
            
            }

            function mul(){
                let result = num1*num2;
                document.getElementById("result").innerHTML=result;
            }

            function div(){
                let result ;

                if(num2==0){
                    result="num2 cannot be zero"
                }else{
                    result=num1/num2;
                }

                document.getElementById("result").innerHTML=result;
            }

             function square(){
                let s1=Math.pow(num1,1/3);
                let s2=Math.sqrt(num2);
                document.getElementById("result").innerHTML="the square of num1 is "+s1+" and the squre of num2 is "+s2;
            }
        </script>
</body>
</html>
