<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .login-box {
      width: 350px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      color: #333;
      font-weight: bold;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }

    .input-group input:focus {
      border-color: #667eea;
    }

    .password-box {
      position: relative;
    }

    .password-box span {
      position: absolute;
      right: 12px;
      top: 12px;
      cursor: pointer;
      color: #667eea;
      font-size: 14px;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-btn:hover {
      background: #5568d9;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .signup-text {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .signup-text a {
      color: #667eea;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h2>Login</h2>

    <form onsubmit="loginUser(event)">
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email">
      </div>

      <div class="input-group">
        <label>Password</label>
        <div class="password-box">
          <input type="password" id="password" placeholder="Enter your password">
          <span onclick="togglePassword()">Show</span>
        </div>
      </div>

      <button type="submit" class="login-btn">Login</button>

      <p class="message" id="message"></p>

      <p class="signup-text">
        Don't have an account? <a href="#">Sign up</a>
      </p>
    </form>
  </div>

  <script src="Activity2.js">
    
  </script>
</body>
</html>
