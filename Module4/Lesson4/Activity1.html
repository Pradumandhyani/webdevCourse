<html>
  <head><title>Arrays and objects</title></head>
  <body>
    <script>
      var areef=["dog","cat","horse",21,45,56.4]
      // document.write(areef.length)
      for(var i=0;i<areef.length;i++){
        document.write(areef[i])
        document.write("<br>")
      }
      var obj={
        name:"areef",
        age:15,
        address:"nigeria"
      }
      document.write(obj.name)
      document.write("<br>")
      document.write(obj.address)
    </script>
  </body>
</html>
