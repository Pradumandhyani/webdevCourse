<!DOCTYPE html>
<html>
<head>
  <title>Sum of Arguments</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background-color: white;
      padding: 25px;
      width: 350px;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 0 10px gray;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 8px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      background-color: green;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: darkgreen;
    }

    #result {
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
      color: blue;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>Sum of Arguments</h2>

    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">
    <input type="number" id="num3" placeholder="Enter third number">

    <br><br>

    <button onclick="showSum()">Find Sum</button>

    <p id="result"></p>
  </div>

  <script>
    function sum(a, b, c) {
      return a + b + c;
    }

    function showSum() {
      let n1 = Number(document.getElementById("num1").value);
      let n2 = Number(document.getElementById("num2").value);
      let n3 = Number(document.getElementById("num3").value);

      let answer = sum(n1, n2, n3);

      document.getElementById("result").innerHTML = "Sum = " + answer;
    }
  </script>

</body>
</html>
