<!DOCTYPE html>
<html>
<body>

<p>Finding the largest number with help of Argument Objects</p>
<p id="result"></p>
<script>
    

    let arr=[2,3,45,1,5,7,8];

    let max=0;
    for(let i=0;i<=6;i++){
        if(arr[i]>max){   //
            max=arr[i];   //  max=2=> max=3 => max=45 
        }
    }
    document.write(max);


</script>

</body>
</html>
