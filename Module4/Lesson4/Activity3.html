<!DOCTYPE html>
<html>
<body>

<p>Finding the largest number with help of Argument Objects</p>
<p id="result"></p>
<script>
    function findMax() {
   
    var max = 0;
    for(var i = 0; i < arguments.length; i++) {
    if (arguments[i] > max) {  // 7>0 -> 8>7
    max = arguments[i]; // max=7 -> max=8
    }
    }
    return max;
    }

    document.getElementById("result").innerHTML = findMax(7, 5, 6, 8);
</script>

</body>
</html>
