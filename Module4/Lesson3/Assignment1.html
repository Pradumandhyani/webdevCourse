<!DOCTYPE html>
<html>
<head>
  <title>Methods and Loops</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background-color: white;
      padding: 25px;
      width: 350px;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 0 10px gray;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 10px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      background-color: green;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: darkgreen;
    }

    #result {
      margin-top: 15px;
      font-size: 18px;
      color: blue;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>Methods and Loops</h2>

    <input type="number" id="number" placeholder="Enter a number">

    <br>

    <button onclick="printNumbers()">Print Numbers</button>

    <p id="result"></p>
  </div>

  <script>
    function printNumbers() {
      let num = Number(document.getElementById("number").value);
      let output = "";

      for (let i = 1; i <= num; i++) {
        output = output + i + "<br>";
      }

      document.getElementById("result").innerHTML = output;
    }
  </script>

</body>
</html>
