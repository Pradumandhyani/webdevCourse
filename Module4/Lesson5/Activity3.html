<!DOCTYPE html>
<html>
<body>
<h2>JavaScript Functions</h2>
<p>Do a calculation and then display the result.</p>
<p id="demo"></p>
<script>


function table(n){
for(let i=1;i<=10;i++){
    document.write(i*n);
    document.write("<br>");
}
}

for(let i=1;i<=10;i++){
    table(i);
}
</script>
</body>
</html>
