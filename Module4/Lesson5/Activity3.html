<!DOCTYPE html>
<html>
<body>
<h2>JavaScript Functions</h2>
<p>Do a calculation and then display the result.</p>
<p id="demo"></p>
<script>

var result="";
function tables(n){
for(var i=1;i<=10;i++){
    result+=(i*n)+"<br>"
}
}
for(let i=1;i<=10;i++){
    tables(i);
}

document.getElementById("demo").innerHTML = result;
</script>
</body>
</html>
