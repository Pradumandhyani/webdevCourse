<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Arrays</h2>

<p id="demo"></p>

<script>
var cars = ["Porche 9:11", "Rolce royce", "lamborghini urus", "Lamborghini aventador","hummer"];

var res="";
for(var i=0;i<cars.length;i++){
    res+=cars[i]+"<br>";
}

document.getElementById("demo").innerHTML = res;
</script>

</body>
</html>
