<!-- static
This is the default position; the element stays in its normal place.
relative
The element moves from its original position using top, left, right, or bottom.
absolute
The element is placed according to its nearest positioned parent.
fixed
The element stays fixed on the screen even when we scroll.
sticky
The element scrolls normally first, then sticks at a fixed position when it reaches that point. -->

<!DOCTYPE html>
<html>
<head>
  <title>Tasty Bites – Activity 1</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fff8f0; padding: 30px; }
    h1 { color: #e85d04; text-align: center; }
    h2 { color: #e85d04; margin-top: 30px; }
    p  { color: #555; margin-bottom: 10px; }

    .menu-item {
      background: #ffe8d6;
      border: 2px solid #e85d04;
      padding: 10px 20px;
      margin: 8px 0;
      width: 200px;
    }

    .compare-wrap { display: flex; gap: 30px; margin-top: 10px; }
    .compare-col  { flex: 1; }
    .compare-col p { font-size: 12px; color: #a0522d; margin-bottom: 6px; }

    .special-badge {
      background: #e85d04;
      color: white;
      padding: 10px 20px;
      margin: 8px 0;
      width: 200px;
      position: relative;
      left: 40px;
    }

    .reserved {
      border: 2px dashed #e85d04;
      padding: 10px 20px;
      width: 200px;
      margin: 8px 0;
      color: #e85d04;
      font-size: 12px;
    }
  </style>
</head>
<body>

  
    <div class="compare-col">
      <p>With position: relative; left: 40px:</p>
      <div class="menu-item">&#127829; Pizza — $8.99</div>
      <div class="reserved">&#8592; original space reserved</div>
      <div class="special-badge">&#11088; Chef's Special!</div>
      <div class="menu-item">&#127839; Sandwich — $5.49</div>
    </div>


</body>
</html>
